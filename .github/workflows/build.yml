name: build
on: [push, pull_request]
env:
  PY_COLORS: "1"
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.x']
    steps:
      - uses: actions/checkout@v3
      - name: Set up PDM
        uses: pdm-project/setup-pdm@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pdm sync --dev
      - name: Run tests
        run: pdm run -v pytest autobean_refactor -k 'not benchmark' --cov autobean_refactor --cov-report xml
      - name: Run type checks
        run: pdm run -v mypy autobean_refactor
      - name: Upload coverage
        if: matrix.python-version == '3.x'
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          files: coverage.xml
          add-prefix: autobean_refactor
      - name: Run benchmark
        run: pdm run -v pytest autobean_refactor -sv -k 'benchmark'
